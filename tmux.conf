# tmux setup for "solaris-sparc64 session": window "console" is the guest's serial
# console, Ctrl-B m opens the VM menu (vmctl), Ctrl-B d detaches.

# The serial console can't tell Solaris the terminal size, and the installer assumes
# 80x24, so the console keeps that size whatever terminal attaches. "Console fit to
# terminal" in the menu resizes it (then "stty rows R columns C" in Solaris).
# solaris-sparc64 sets "window-size manual" once the session exists: tmux 3.4 crashes
# when it is set here, at server start.
set -g default-size 80x24
set -g default-terminal tmux-256color
set -g history-limit 20000
set -sg escape-time 10
set -g set-titles on
set -g set-titles-string "Solaris (#{session_name}:#{window_name})"

set -g status-interval 5
set -g status-left "[#{session_name}] "
set -g status-left-length 20
set -g status-right "#(vmctl statusline)  | C-b m: menu  C-b d: detach"
set -g status-right-length 80

bind m run-shell -b "vmctl -c '#{client_name}' menu"
